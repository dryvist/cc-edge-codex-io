name: release-please

# Inherits the org-native release-please pipeline from dryvist/.github, which
# enforces the org-wide major-bump block, eager-auto-merges the release PR, and
# uses the dryvist release App token so release PRs trigger downstream workflows.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    if: github.event.repository.is_template == false
    permissions:
      contents: write
      pull-requests: write
    uses: dryvist/.github/.github/workflows/_release-please.yml@main
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}

  # release-please creates the release as a draft (release-please-config.json).
  # Build and attach the pack first, then publish: a published release is immutable.
  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: dryvist/cc-edge-pack-template/.github/workflows/cribl-pack-release.yml@main
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write

      # The App token, not GITHUB_TOKEN: publishing with GITHUB_TOKEN emits no
      # `release: published` event for downstream `on: release` workflows.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # No checkout in this job, so gh cannot infer the repo from a git remote.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false
